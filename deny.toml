# cargo-deny: giấy phép, lỗ hổng, nguồn phụ thuộc. Chạy: cargo deny check
[graph]
all-features = true

[advisories]
# Mọi cảnh báo RustSec (lỗ hổng, không còn bảo trì, bị rút) đều chặn; ngoại lệ ghi rõ lý do + hạn.
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
# Crate của chính repo (publish = false, AGPL-3.0-only) không cần nằm trong danh sách cho phép.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
