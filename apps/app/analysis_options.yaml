include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - rust_builder/**
    - lib/src/bridge/generated/**
  errors:
    unused_import: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_final_fields
    - unawaited_futures
    - avoid_print
    - directives_ordering
    - prefer_single_quotes

formatter:
  page_width: 120
