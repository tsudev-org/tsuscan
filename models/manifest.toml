# Manifest mô hình AI của Tsu Scan. Tệp mô hình KHÔNG nằm trong git: tải bằng `scripts/fetch-models.sh`
# (kiểm sha256) vào thư mục này. Manifest được nhúng vào app lúc build (crates/tsuscan-ml/src/manifest.rs) và là mỏ neo
# tin cậy: tệp sai kích thước/sha256 bị từ chối trước khi tới engine suy luận.
# Chỉ nhận giấy phép trọng số Apache-2.0/MIT/BSD (ADR-0002, ADR-0007). URL ghim theo commit, không theo nhánh.
schema = 1

[signing]
# Khóa công khai minisign của tsudev cho mô hình phát hành lại từ GitHub Release (P12). Trống ⇒ chỉ kiểm sha256.
public_key = ""

