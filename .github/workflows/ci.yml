# Cổng kiểm cho mọi PR và main. Action ghim SHA; công cụ tải ngoài ghim phiên bản + checksum.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.8'
  FLUTTER_COMMIT: '737ba8f885dc774b53b442759999a312c9461e4e'
  FRB_VERSION: '2.13.0'

jobs:
  standards:
    name: Quy ước tsudev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/check-standards.sh
      - run: ./scripts/sync-standards.sh --check

  gitleaks:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks-action đòi license khi repo thuộc Organization ⇒ binary ghim phiên bản + checksum.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .


  rust:
    name: Lõi Rust (crates)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      # Công cụ tải ngoài: ghim phiên bản + sha256 (giống gitleaks).
      CARGO_DENY_VERSION: '0.20.2'
      CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
      LLVM_COV_VERSION: '0.9.1'
      LLVM_COV_SHA256: '3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522'
      # Test PDF đối chiếu bằng bộ đọc độc lập (poppler, qpdf): thiếu công cụ thì TRƯỢT (cục bộ chỉ bỏ qua).
      TSUSCAN_REQUIRE_PDF_TOOLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Công cụ đối chiếu PDF (poppler-utils, qpdf) + libsodium kiểm vector mật mã (kho Ubuntu đã ký)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils qpdf libsodium23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Toolchain ghim trong rust-toolchain.toml
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
      - name: Cài cargo-deny + cargo-llvm-cov (binary ghim checksum)
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"; mkdir -p "$bin"
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$f"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$bin/"
          f="cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/$f"
          echo "${LLVM_COV_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test + độ phủ (≥ 85% dòng cho tsuscan-imaging, tsuscan-doc, tsuscan-vault)
        run: |
          cargo llvm-cov --workspace --locked --no-report -- --nocapture
          cargo llvm-cov report --package tsuscan-imaging --ignore-filename-regex 'synth\.rs|tsuscan-cli' --fail-under-lines 85
          cargo llvm-cov report --package tsuscan-doc --ignore-filename-regex 'tsuscan-imaging|tsuscan-ml|tsuscan-cli|examples' --fail-under-lines 85
          cargo llvm-cov report --package tsuscan-vault --ignore-filename-regex 'tsuscan-imaging|tsuscan-ml|tsuscan-doc|tsuscan-cli|examples' --fail-under-lines 85
          cargo llvm-cov report --package tsuscan_ffi --ignore-filename-regex 'frb_generated|tsuscan-imaging|tsuscan-ml|tsuscan-doc|tsuscan-vault|tsuscan-cli|examples' --fail-under-lines 85
      - name: Vector mật mã kho (ADR-0009) - đúng bản sinh hiện tại + libsodium độc lập giải được
        run: |
          set -euo pipefail
          cargo run -q --locked -p tsuscan-vault --example gen_conformance > "$RUNNER_TEMP/vault-v1.json"
          diff -u conformance/vault-v1.json "$RUNNER_TEMP/vault-v1.json"
          python3 -I conformance/verify_libsodium.py conformance/vault-v1.json
      - run: cargo deny --locked check
      - name: Benchmark biên dịch được
        run: cargo bench --workspace --locked --no-run

  ml:
    name: AI trên máy (tsuscan-ml)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      LLVM_COV_VERSION: '0.9.1'
      LLVM_COV_SHA256: '3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522'
      # Thiếu mô hình thì test TRƯỢT (cục bộ chỉ bỏ qua).
      TSUSCAN_REQUIRE_MODELS: '1'
      TSUSCAN_OCR_PAGES: '12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ml-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ml-${{ runner.os }}-
      # Tệp mô hình cache theo hash manifest; script vẫn kiểm lại sha256 từng tệp sau khi khôi phục.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('models/manifest.toml') }}
      - name: Tải mô hình (kiểm sha256)
        run: ./scripts/fetch-models.sh
      - name: Toolchain + cargo-llvm-cov (binary ghim checksum)
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          bin="$HOME/.local/bin"; mkdir -p "$bin"
          f="cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/$f"
          echo "${LLVM_COV_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - run: cargo run -q --locked -p tsuscan-cli -- models
      - name: OCR thật → PDF có lớp chữ → pdftotext (CER ≤ 3%)
        env:
          TSUSCAN_REQUIRE_PDF_TOOLS: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
          cargo test -q --locked -p tsuscan-doc --test ocr_pdf -- --nocapture
      - name: Test có mô hình (CER ≤ 3%, hướng trang, làm phẳng) + độ phủ ≥ 85% dòng
        run: |
          cargo llvm-cov --package tsuscan-ml --locked --no-report -- --nocapture --test-threads=1
          cargo llvm-cov report --package tsuscan-ml --ignore-filename-regex 'synth\.rs|tsuscan-imaging|examples' --fail-under-lines 85

  app:
    name: App Flutter (Linux, Web, Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Flutter (ghim tag + commit)
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Gói hệ thống cho build Linux (GTK, libsecret)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev >/dev/null
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: app-${{ runner.os }}-frb${{ env.FRB_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: app-${{ runner.os }}-frb${{ env.FRB_VERSION }}-
      - name: Codegen flutter_rust_bridge (ghim phiên bản, --locked)
        run: |
          set -euo pipefail
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -qx "flutter_rust_bridge_codegen ${FRB_VERSION}"; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked --force
          fi
      - name: Tệp sinh (cầu nối, i18n, token) phải khớp mã nguồn
        working-directory: apps/app
        run: |
          set -euo pipefail
          flutter pub get
          ../../scripts/gen-bridge.sh
          flutter gen-l10n
          dart run tool/gen_tokens.dart
          dart format -l 120 lib/src/ui/theme >/dev/null
          cd ../.. && cargo fmt --all
          git diff --exit-code -- apps/app/lib crates/tsuscan-ffi/src \
            || { echo "::error::Tệp sinh đã cũ - chạy scripts/gen-bridge.sh, flutter gen-l10n, dart run tool/gen_tokens.dart"; exit 1; }
      - name: Định dạng, phân tích, test
        working-directory: apps/app
        run: |
          set -euo pipefail
          dart format -l 120 --set-exit-if-changed lib/main.dart lib/src/app.dart lib/src/app_scope.dart lib/src/bootstrap lib/src/data lib/src/features lib/src/services lib/src/utils lib/src/ui test tool
          flutter analyze --fatal-infos
          flutter test
      - name: Build Linux (release, lõi Rust qua cargokit)
        working-directory: apps/app
        run: flutter build linux --release
      - name: Chạy thử bản Linux (khởi động, mở kho thật, không lỗi)
        working-directory: apps/app
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends xvfb dbus-x11 gnome-keyring >/dev/null
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg"
          # libsecret cần một keyring đang mở khóa trong phiên D-Bus.
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a timeout 40 build/linux/x64/release/bundle/tsuscan > "$RUNNER_TEMP/run.log" 2>&1 || true'
          cat "$RUNNER_TEMP/run.log"
          if grep -qiE "Unhandled Exception|failed to load dynamic library|Failed to lookup symbol" "$RUNNER_TEMP/run.log"; then
            echo "::error::App Linux lỗi khi khởi động"; exit 1
          fi
          test -f "$XDG_DATA_HOME/com.tsudev.tsuscan/library/vault.db" \
            || { echo "::error::App không tạo được kho mã hóa"; ls -R "$XDG_DATA_HOME" || true; exit 1; }
          # Kho phải là tệp mã hóa: không có tiêu đề SQLite rõ.
          if head -c 16 "$XDG_DATA_HOME/com.tsudev.tsuscan/library/vault.db" | grep -q "SQLite format 3"; then
            echo "::error::vault.db không được mã hóa"; exit 1
          fi
      - name: Build Web (xem trước, kho bộ nhớ - lõi WASM ở P11)
        working-directory: apps/app
        run: flutter build web --release --base-href /app/ --csp --no-web-resources-cdn
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: '17' }
      - name: Build Android APK (arm64, debug - ký phát hành ở P12)
        working-directory: apps/app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Kích thước APK
        working-directory: apps/app
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - name: Quyền Android tối thiểu (manifest release đã gộp)
        working-directory: apps/app/android
        run: |
          set -euo pipefail
          # Plugin hay tự khai thêm quyền (ghi âm, bộ nhớ ngoài, mạng): chặn mọi quyền ngoài danh sách đã rà soát.
          ./gradlew -q :app:processReleaseMainManifest -x cargokitCargoBuildTsuscan_ffiRelease
          m=$(find ../build/app/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)
          got=$(grep -oE '<uses-permission[^>]*android:name="[^"]+"' "$m" | sed -E 's/.*name="([^"]+)"/\1/' | sort)
          want=$(printf '%s\n' android.permission.CAMERA android.permission.USE_BIOMETRIC \
            android.permission.USE_FINGERPRINT com.tsudev.tsuscan.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION | sort)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::Quyền Android lệch danh sách đã rà soát (docs/security-reviews/20261119-p6-camera.md)"
            diff <(echo "$want") <(echo "$got") || true
            exit 1
          fi
