# Cổng kiểm cho mọi PR và main. Action ghim SHA; công cụ tải ngoài ghim phiên bản + checksum.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Quy ước tsudev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/check-standards.sh
      - run: ./scripts/sync-standards.sh --check

  gitleaks:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks-action đòi license khi repo thuộc Organization ⇒ binary ghim phiên bản + checksum.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .


  rust:
    name: Lõi Rust (crates)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      # Công cụ tải ngoài: ghim phiên bản + sha256 (giống gitleaks).
      CARGO_DENY_VERSION: '0.20.2'
      CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
      LLVM_COV_VERSION: '0.9.1'
      LLVM_COV_SHA256: '3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522'
      # Test PDF đối chiếu bằng bộ đọc độc lập (poppler, qpdf): thiếu công cụ thì TRƯỢT (cục bộ chỉ bỏ qua).
      TSUSCAN_REQUIRE_PDF_TOOLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Công cụ đối chiếu PDF (poppler-utils, qpdf - kho Ubuntu đã ký)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils qpdf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Toolchain ghim trong rust-toolchain.toml
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
      - name: Cài cargo-deny + cargo-llvm-cov (binary ghim checksum)
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"; mkdir -p "$bin"
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$f"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$bin/"
          f="cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/$f"
          echo "${LLVM_COV_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test + độ phủ (≥ 85% dòng cho tsuscan-imaging, tsuscan-doc)
        run: |
          cargo llvm-cov --workspace --locked --no-report -- --nocapture
          cargo llvm-cov report --package tsuscan-imaging --ignore-filename-regex 'synth\.rs|tsuscan-cli' --fail-under-lines 85
          cargo llvm-cov report --package tsuscan-doc --ignore-filename-regex 'tsuscan-imaging|tsuscan-ml|tsuscan-cli|examples' --fail-under-lines 85
      - run: cargo deny --locked check
      - name: Benchmark biên dịch được
        run: cargo bench --workspace --locked --no-run

  ml:
    name: AI trên máy (tsuscan-ml)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      LLVM_COV_VERSION: '0.9.1'
      LLVM_COV_SHA256: '3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522'
      # Thiếu mô hình thì test TRƯỢT (cục bộ chỉ bỏ qua).
      TSUSCAN_REQUIRE_MODELS: '1'
      TSUSCAN_OCR_PAGES: '12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ml-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ml-${{ runner.os }}-
      # Tệp mô hình cache theo hash manifest; script vẫn kiểm lại sha256 từng tệp sau khi khôi phục.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('models/manifest.toml') }}
      - name: Tải mô hình (kiểm sha256)
        run: ./scripts/fetch-models.sh
      - name: Toolchain + cargo-llvm-cov (binary ghim checksum)
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          bin="$HOME/.local/bin"; mkdir -p "$bin"
          f="cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/$f"
          echo "${LLVM_COV_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - run: cargo run -q --locked -p tsuscan-cli -- models
      - name: OCR thật → PDF có lớp chữ → pdftotext (CER ≤ 3%)
        env:
          TSUSCAN_REQUIRE_PDF_TOOLS: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
          cargo test -q --locked -p tsuscan-doc --test ocr_pdf -- --nocapture
      - name: Test có mô hình (CER ≤ 3%, hướng trang, làm phẳng) + độ phủ ≥ 85% dòng
        run: |
          cargo llvm-cov --package tsuscan-ml --locked --no-report -- --nocapture --test-threads=1
          cargo llvm-cov report --package tsuscan-ml --ignore-filename-regex 'synth\.rs|tsuscan-imaging|examples' --fail-under-lines 85
