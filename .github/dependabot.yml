version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: cargo
    directories: [/, /fuzz]
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 3
    # flutter_rust_bridge: crate Rust + gói Dart + mã sinh + codegen ghim phải CÙNG bản (test frb_version_test,
    # sự cố lotus-share 26.11.1801) - nâng tay cả bốn bằng scripts/gen-bridge.sh.
    ignore:
      - dependency-name: flutter_rust_bridge
    groups: { cargo: { patterns: ['*'] } }
  - package-ecosystem: pub
    directory: /apps/app
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: flutter_rust_bridge
    groups: { pub: { patterns: ['*'] } }
# Thêm npm (P8, P11) khi có tệp khóa phụ thuộc.
