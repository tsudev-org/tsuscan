[package]
name = "tsuscan-doc"
description = "Tài liệu Tsu Scan: ghi PDF có lớp chữ (PDF/A-2b, AES-256), xuất DOCX/XLSX/TXT/Markdown/ảnh, nhập PDF/ảnh, che thông tin, chữ ký, mã vạch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tsuscan-imaging = { workspace = true, features = ["barcode"] }
tsuscan-ml.workspace = true
image.workspace = true
thiserror.workspace = true
# Ghi PDF (cú pháp mức thấp, không tự nén/mã hóa: phần đó do crate này làm).
pdf-writer = "0.15.0"
# Đọc + vẽ PDF nhập vào (thuần Rust, forbid(unsafe) ở crate gốc, có giải mã AES).
hayro = "0.9.0"
# Nén: Flate (miniz_oxide), JPEG (jpeg-encoder), CCITT G4 cho trang đen trắng (fax).
miniz_oxide = "0.9.1"
jpeg-encoder = "0.7.1"
fax = "0.3.0"
crc32fast = "1.5.5"
# Mã hóa PDF AES-256 (ISO 32000-2, bộ xử lý bảo mật chuẩn R6).
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
sha2 = "0.11.1"
getrandom = "0.4.3"
unicode-normalization = "0.1.26"

[dev-dependencies]
# Bộ mã hóa chỉ để sinh QR/mã vạch mẫu trong test (app chỉ cần bộ giải mã).
rxing = { version = "0.9.4", default-features = false, features = ["encoders", "decoders", "qrcode", "oned"] }
tsuscan-ml = { workspace = true, features = ["synth"] }
tsuscan-imaging = { workspace = true, features = ["synth"] }

[lints]
workspace = true
