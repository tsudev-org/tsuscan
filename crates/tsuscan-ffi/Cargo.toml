[package]
name = "tsuscan_ffi"
description = "Cầu Rust ↔ Flutter của Tsu Scan (flutter_rust_bridge): kho, ảnh trang, khóa app, tìm kiếm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: Android/Linux/Windows nạp động; staticlib: iOS/macOS liên kết tĩnh (cargokit chọn theo đích).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Phiên bản PHẢI khớp `flutter_rust_bridge` trong apps/app/pubspec.yaml và codegen (`scripts/gen-bridge.sh`).
flutter_rust_bridge = "=2.13.0"
# `barcode`: chế độ QR (rxing, chỉ bộ giải mã). KHÔNG phụ thuộc tsuscan-ml/tsuscan-doc ở đây: LTO không loại được
# tract khỏi `.so` (đo 19/11/2026: 3,9 → 17,7 MB arm64) - gáy sách và mã vạch là thuật toán cổ điển trong imaging.
tsuscan-imaging = { workspace = true, features = ["barcode"] }
tsuscan-vault.workspace = true
image.workspace = true
argon2 = "0.6.0"
subtle = "2.6.1"
zeroize = "1.9.2"
getrandom = "0.4.3"

# KHÔNG kế thừa `unsafe_code = "forbid"` của workspace: mã do flutter_rust_bridge sinh (`frb_generated.rs`) dùng
# `unsafe` để trao con trỏ qua FFI (docs/ARCHITECTURE.md mục 5 - ngoại lệ duy nhất cùng backend phần cứng).
# Mã viết tay trong `src/api` vẫn bị cấm `unsafe` bằng `#![deny(unsafe_code)]` ở `api/mod.rs`.
[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
# API cầu nối nhận giá trị sở hữu (String, Vec<u8>) theo yêu cầu của flutter_rust_bridge.
needless_pass_by_value = "allow"

[dev-dependencies]
# Ảnh cảnh có nhãn (P1) để kiểm dò mép/nắn qua đúng bề mặt API.
tsuscan-imaging = { workspace = true, features = ["synth"] }
# Bộ mã hóa chỉ để sinh QR mẫu trong test (app chỉ có bộ giải mã).
rxing = { version = "0.9.4", default-features = false, features = ["encoders", "decoders", "qrcode"] }
